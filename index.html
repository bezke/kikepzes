<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NKE RTK Alapkiképzés Órarend Tervező</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Ikonok -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Egyedi gördítősáv a táblázathoz */
        .custom-scrollbar::-webkit-scrollbar { height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%;
            width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">

    <div id="app"></div>

    <script>
        // --- KONSTANSOK ÉS ALAPADATOK ---
        const START_DATE = new Date('2026-08-24T00:00:00');
        const END_DATE = new Date('2026-09-25T00:00:00');
        const GROUPS = ['g1', 'g2']; // I. csoport, II. csoport
        const GROUP_CAPACITY = 150;

        const TIME_SLOTS = [
            { id: 's1', label: '1-2. óra', time: '08:00 - 09:45', isMorning: true },
            { id: 's2', label: '3-4. óra', time: '10:00 - 11:45', isMorning: true },
            { id: 's3', label: '5-6. óra', time: '12:00 - 13:45', isMorning: false },
            { id: 'lunch', label: 'Ebéd', time: '13:35 - 15:00', isMorning: false, isLunch: true },
            { id: 's4', label: '8-9. óra', time: '15:00 - 16:45', isMorning: false },
            { id: 's5', label: '10-11. óra', time: '17:00 - 18:45', isMorning: false }
        ];

        const SUBJECTS = {
            'jogi': { name: 'Jogi Ismeretek', color: 'bg-blue-100 border-blue-300 text-blue-800' },
            'lo': { name: 'Lőkiképzés', color: 'bg-red-100 border-red-300 text-red-800' },
            'test': { name: 'Rendőri testnevelés', color: 'bg-green-100 border-green-300 text-green-800' },
            'szolg': { name: 'Ált. Szolgálati Ismer.', color: 'bg-purple-100 border-purple-300 text-purple-800' },
            'alaki': { name: 'Alaki foglalkozás', color: 'bg-yellow-100 border-yellow-300 text-yellow-800' },
            'oszt': { name: 'Osztályfőnöki óra', color: 'bg-gray-100 border-gray-300 text-gray-800' }
        };

        const DEFAULT_CLASSROOMS = [
            { id: 'c1', name: 'O-I (500 fős)', capacity: 500 },
            { id: 'c2', name: 'ROÉK alakuló tér', capacity: 300 },
            { id: 'c3', name: 'O-III', capacity: 150 }, // Bővítve 150-re a csoportlétszám miatt
            { id: 'c4', name: 'O-IV', capacity: 150 }, // Bővítve 150-re
            { id: 'c5', name: 'Sportpálya', capacity: 500 },
            { id: 'c6', name: 'Lőtér', capacity: 150 },
            { id: 'c7', name: 'R-KOLL MULTI 1', capacity: 100 }
        ];

        // --- ÁLLAPOT KEZELÉS ---
        let state = {
            schedule: {},
            classrooms: JSON.parse(JSON.stringify(DEFAULT_CLASSROOMS)),
            fixedDays: {}
        };
        let uiState = {
            activeTab: 'schedule',
            currentWeekIndex: 0,
            isGenerating: false
        };

        let validDays = [];
        let weeks = [];

        // --- SEGÉDFÜGGVÉNYEK ---
        function initDates() {
            let current = new Date(START_DATE);
            while (current <= END_DATE) {
                const isWeekend = current.getDay() === 0 || current.getDay() === 6;
                const isFirstWeekend = current.getTime() === new Date('2026-08-29T00:00:00').getTime() || 
                                       current.getTime() === new Date('2026-08-30T00:00:00').getTime();
                
                if (!isWeekend || isFirstWeekend) {
                    validDays.push(current.toISOString().split('T')[0]);
                }
                current.setDate(current.getDate() + 1);
            }

            let currentWeek = [];
            validDays.forEach((day, index) => {
                currentWeek.push(day);
                const d = new Date(day);
                if (d.getDay() === 0 || index === validDays.length - 1) {
                    weeks.push(currentWeek);
                    currentWeek = [];
                }
            });
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            const days = ['Vasárnap', 'Hétfő', 'Kedd', 'Szerda', 'Csütörtök', 'Péntek', 'Szombat'];
            return `${d.getMonth() + 1}.${d.getDate().toString().padStart(2, '0')}. ${days[d.getDay()]}`;
        }

        // --- ADATTÁROLÁS (LocalStorage) ---
        function loadData() {
            const saved = localStorage.getItem('rtk_schedule_data');
            if (saved) {
                const parsed = JSON.parse(saved);
                state.schedule = parsed.schedule || {};
                state.classrooms = parsed.classrooms || DEFAULT_CLASSROOMS;
                state.fixedDays = parsed.fixedDays || {};
            } else {
                generateAlgorithm(); // Üres állapotnál rögtön generálunk egyet
            }
        }

        function saveData() {
            localStorage.setItem('rtk_schedule_data', JSON.stringify(state));
            render();
        }

        // --- ALGORITMUS ---
        function generateAlgorithm() {
            uiState.isGenerating = true;
            render();

            setTimeout(() => { // Timeout, hogy a UI frissüljön a "Generálás..." felirattal
                let newSched = JSON.parse(JSON.stringify(state.schedule));
                
                // Csoportonkénti kvóták (óraszám / 5 hét)
                let quotas = {
                    'g1': { jogi: 18, lo: 10, test: 15, szolg: 12, alaki: 12, oszt: 6 },
                    'g2': { jogi: 18, lo: 10, test: 15, szolg: 12, alaki: 12, oszt: 6 }
                };

                validDays.forEach(day => {
                    if (state.fixedDays[day]) return; // Fixált nap kimarad
                    
                    let dayPlan = { s1: {}, s2: {}, s3: {}, s4: {}, s5: {} };
                    
                    // Tárgyak kiosztása csoportonként
                    GROUPS.forEach(groupId => {
                        let slotsToFill = ['s1', 's2', 's3', 's4', 's5'];
                        let daySubjects = [];

                        // 1. Szabály: Lőkiképzés (2 egymást követő sáv = 4 óra)
                        if (quotas[groupId].lo > 0 && Math.random() > 0.6) {
                            const pairs = [['s1', 's2'], ['s3', 's4'], ['s4', 's5']];
                            const availablePairs = pairs.filter(p => slotsToFill.includes(p[0]) && slotsToFill.includes(p[1]));
                            if (availablePairs.length > 0) {
                                const pair = availablePairs[Math.floor(Math.random() * availablePairs.length)];
                                dayPlan[pair[0]][groupId] = 'lo';
                                dayPlan[pair[1]][groupId] = 'lo';
                                slotsToFill = slotsToFill.filter(s => s !== pair[0] && s !== pair[1]);
                                quotas[groupId].lo -= 2;
                                daySubjects.push('lo');
                            }
                        }

                        // 2. Szabály: Jogi ismeretek (délelőtt)
                        if (quotas[groupId].jogi > 0 && Math.random() > 0.3) {
                            const morningSlots = slotsToFill.filter(s => s === 's1' || s === 's2');
                            if (morningSlots.length > 0) {
                                const slot = morningSlots[Math.floor(Math.random() * morningSlots.length)];
                                dayPlan[slot][groupId] = 'jogi';
                                slotsToFill = slotsToFill.filter(s => s !== slot);
                                quotas[groupId].jogi -= 1;
                                daySubjects.push('jogi');
                            }
                        }

                        // 3. Többi tárgy kitöltése
                        slotsToFill.forEach(slot => {
                            let availableSubjects = Object.keys(quotas[groupId]).filter(k => 
                                quotas[groupId][k] > 0 && !daySubjects.includes(k) && k !== 'lo' && k !== 'jogi'
                            );
                            if (availableSubjects.length === 0) availableSubjects = ['test', 'szolg', 'alaki']; 

                            const subj = availableSubjects[Math.floor(Math.random() * availableSubjects.length)];
                            dayPlan[slot][groupId] = subj;
                            if (quotas[groupId][subj]) quotas[groupId][subj]--;
                            daySubjects.push(subj);
                        });
                    });

                    // Termek kiosztása idősávonként (ütközésvizsgálattal)
                    ['s1', 's2', 's3', 's4', 's5'].forEach(slot => {
                        let slotUsedRooms = [];
                        newSched[day] = newSched[day] || {};
                        newSched[day][slot] = {};

                        let g1Subj = dayPlan[slot]['g1'];
                        let g2Subj = dayPlan[slot]['g2'];

                        // Ha ugyanazt a tárgyat kapják, próbáljuk összevonni
                        if (g1Subj === g2Subj) {
                            let bigRoom = state.classrooms.find(r => r.capacity >= 300);
                            if (bigRoom) {
                                newSched[day][slot]['g1'] = { subjectId: g1Subj, classroomId: bigRoom.id };
                                newSched[day][slot]['g2'] = { subjectId: g2Subj, classroomId: bigRoom.id };
                                return; // Kész a sáv
                            }
                        }

                        // Ha nem tudjuk összevonni, külön terem kell
                        GROUPS.forEach(groupId => {
                            const subj = dayPlan[slot][groupId];
                            let suitableRoom = state.classrooms.find(r => r.capacity >= 150 && !slotUsedRooms.includes(r.id));
                            
                            let roomId = suitableRoom ? suitableRoom.id : 'NO_ROOM';
                            if (roomId !== 'NO_ROOM') slotUsedRooms.push(roomId);
                            
                            newSched[day][slot][groupId] = { subjectId: subj, classroomId: roomId };
                        });
                    });
                });

                state.schedule = newSched;
                uiState.isGenerating = false;
                saveData();
            }, 100);
        }

        // --- FELÜLETI MŰVELETEK (Window-hoz kötve az inline eventekhez) ---
        window.setTab = (tab) => { uiState.activeTab = tab; render(); };
        window.changeWeek = (dir) => { 
            uiState.currentWeekIndex += dir; 
            if(uiState.currentWeekIndex < 0) uiState.currentWeekIndex = 0;
            if(uiState.currentWeekIndex >= weeks.length) uiState.currentWeekIndex = weeks.length - 1;
            render(); 
        };
        window.toggleDayLock = (day) => {
            state.fixedDays[day] = !state.fixedDays[day];
            saveData();
        };
        window.runGenerate = () => { generateAlgorithm(); };
        
        window.handleRoomChange = (index, field, value) => {
            state.classrooms[index][field] = field === 'capacity' ? parseInt(value) || 0 : value;
            saveData();
        };
        window.addRoom = () => {
            state.classrooms.push({ id: `c${Date.now()}`, name: 'Új terem', capacity: 150 });
            saveData();
        };
        window.deleteRoom = (id) => {
            state.classrooms = state.classrooms.filter(r => r.id !== id);
            saveData();
        };

        // --- RENDERELÉS ---
        function render() {
            const app = document.getElementById('app');
            
            let contentHtml = '';
            
            if (uiState.activeTab === 'schedule') {
                contentHtml = renderSchedule();
            } else if (uiState.activeTab === 'rooms') {
                contentHtml = renderRooms();
            }

            app.innerHTML = `
                <header class="bg-slate-900 text-white p-4 shadow-md">
                    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-3">
                            <div class="bg-blue-600 p-2 rounded-lg">
                                <i class="fa-solid fa-calendar text-xl"></i>
                            </div>
                            <div>
                                <h1 class="text-xl font-bold">NKE RTK Alapkiképzés</h1>
                                <p class="text-sm text-slate-400">Órarend tervező (Csoportbontással) | Céges offline verzió</p>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="setTab('schedule')" class="px-4 py-2 rounded-md font-medium transition-colors ${uiState.activeTab === 'schedule' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                                Órarend
                            </button>
                            <button onclick="setTab('rooms')" class="px-4 py-2 rounded-md font-medium transition-colors flex items-center gap-2 ${uiState.activeTab === 'rooms' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                                <i class="fa-solid fa-cog"></i> Termek
                            </button>
                        </div>
                    </div>
                </header>
                <main class="max-w-[1400px] mx-auto p-4 py-8">
                    ${contentHtml}
                </main>
            `;
        }

        function renderSchedule() {
            const currentWeekDays = weeks[uiState.currentWeekIndex] || [];
            
            let gridHtml = `<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto custom-scrollbar">
                <div class="min-w-[1000px]">
                    <div class="grid grid-cols-[120px_repeat(auto-fit,minmax(200px,1fr))] border-b border-slate-200 bg-slate-50 rounded-t-xl">
                        <div class="p-4 flex items-center justify-center font-medium text-slate-500 border-r border-slate-200">Idősáv</div>`;
            
            currentWeekDays.forEach(day => {
                const isFixed = state.fixedDays[day];
                const parts = formatDate(day).split(' ');
                gridHtml += `
                    <div class="p-3 text-center border-r border-slate-200 last:border-r-0 ${isFixed ? 'bg-blue-50/50' : ''}">
                        <div class="flex justify-between items-center mb-2">
                            <button onclick="toggleDayLock('${day}')" class="p-1.5 rounded-md transition-colors ${isFixed ? 'text-blue-600 bg-blue-100' : 'text-slate-400 hover:bg-slate-200'}" title="${isFixed ? 'Nap feloldása' : 'Nap rögzítése'}">
                                <i class="fa-solid ${isFixed ? 'fa-lock' : 'fa-lock-open'}"></i>
                            </button>
                            <span class="text-[10px] font-semibold px-2 py-1 rounded ${isFixed ? 'bg-blue-200 text-blue-800' : 'bg-slate-200 text-slate-700'}">
                                ${isFixed ? 'Fixálva' : 'Generálható'}
                            </span>
                        </div>
                        <div class="font-bold text-slate-800">${parts[1]}</div>
                        <div class="text-sm text-slate-500">${parts[0]}</div>
                    </div>`;
            });
            gridHtml += `</div>`; // End Grid Header

            // Grid Body
            TIME_SLOTS.forEach(slot => {
                gridHtml += `<div class="grid grid-cols-[120px_repeat(auto-fit,minmax(200px,1fr))] border-b border-slate-100 last:border-b-0">
                    <div class="p-4 flex flex-col justify-center items-center border-r border-slate-200 bg-slate-50">
                        <span class="font-semibold text-slate-700 text-center">${slot.label}</span>
                        <span class="text-xs text-slate-500 text-center mt-1">${slot.time}</span>
                    </div>`;
                
                currentWeekDays.forEach(day => {
                    if (slot.isLunch) {
                        gridHtml += `<div class="p-4 border-r border-slate-100 bg-amber-50/50 flex items-center justify-center last:border-r-0">
                                        <span class="font-semibold text-amber-700"><i class="fa-solid fa-utensils mr-2"></i>Ebéd</span>
                                     </div>`;
                        return;
                    }

                    const slotData = state.schedule[day]?.[slot.id];
                    if (!slotData) {
                        gridHtml += `<div class="p-4 border-r border-slate-100 bg-slate-50/30"></div>`;
                        return;
                    }

                    let cellContent = '';
                    
                    // Összevonás ellenőrzése (I+II csoport ugyanabban a teremben van-e)
                    const g1 = slotData['g1'];
                    const g2 = slotData['g2'];

                    if (g1 && g2 && g1.subjectId === g2.subjectId && g1.classroomId === g2.classroomId) {
                        cellContent = renderSubjectCard(g1, 'I+II. cs.', state.classrooms);
                    } else {
                        // Külön bontva
                        cellContent = `
                            <div class="flex flex-col gap-2 h-full">
                                ${g1 ? renderSubjectCard(g1, 'I. cs.', state.classrooms) : ''}
                                ${g2 ? renderSubjectCard(g2, 'II. cs.', state.classrooms) : ''}
                            </div>
                        `;
                    }

                    gridHtml += `<div class="p-2 border-r border-slate-100 last:border-r-0">${cellContent}</div>`;
                });
                gridHtml += `</div>`;
            });
            gridHtml += `</div></div>`; // End Grid

            return `
                <div class="space-y-6">
                    <!-- Toolbar -->
                    <div class="flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex items-center gap-4 mb-4 sm:mb-0">
                            <button onclick="changeWeek(-1)" ${uiState.currentWeekIndex === 0 ? 'disabled' : ''} class="p-2 w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 disabled:opacity-50 text-slate-600">
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>
                            <span class="font-semibold w-24 text-center">${uiState.currentWeekIndex + 1}. Hét</span>
                            <button onclick="changeWeek(1)" ${uiState.currentWeekIndex === weeks.length - 1 ? 'disabled' : ''} class="p-2 w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 disabled:opacity-50 text-slate-600">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>
                        <button onclick="runGenerate()" ${uiState.isGenerating ? 'disabled' : ''} class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-medium shadow-sm transition-all disabled:opacity-70">
                            ${uiState.isGenerating ? '<div class="loader"></div> Generálás...' : '<i class="fa-solid fa-arrows-rotate"></i> Újragenerálás'}
                        </button>
                    </div>

                    ${gridHtml}
                    
                    <div class="bg-blue-50 text-blue-800 p-4 rounded-xl text-sm border border-blue-100">
                        <strong>Csoportbontás Logika:</strong> A rendszer megpróbálja mindkét (I. és II.) csoport óráit beosztani. Ha ugyanazt a tárgyat kapják (pl. Jogi) és van legalább 300 fős szabad terem, összevonja őket (I+II. cs.). Különben két külön 150 fős terembe teszi őket szeparáltan.
                    </div>
                </div>
            `;
        }

        function renderSubjectCard(data, groupLabel, classroomsList) {
            const subject = SUBJECTS[data.subjectId];
            const room = classroomsList.find(r => r.id === data.classroomId);
            const hasRoomError = data.classroomId === 'NO_ROOM';
            const colorClass = subject ? subject.color : 'bg-gray-100 border-gray-300';

            return `
                <div class="flex-1 rounded-md border p-2 flex flex-col justify-between ${colorClass}">
                    <div class="font-bold text-[11px] mb-1 opacity-80">${groupLabel}</div>
                    <div class="font-semibold text-xs leading-tight mb-2">${subject?.name || 'Ismeretlen'}</div>
                    <div class="mt-auto">
                        ${hasRoomError 
                            ? `<div class="text-[10px] text-red-700 bg-red-200/50 px-1 py-0.5 rounded font-medium"><i class="fa-solid fa-triangle-exclamation"></i> Nincs terem!</div>` 
                            : `<div class="flex flex-col gap-0.5 text-[10px] opacity-90">
                                 <div><i class="fa-solid fa-location-dot"></i> ${room?.name}</div>
                               </div>`
                        }
                    </div>
                </div>
            `;
        }

        function renderRooms() {
            let roomsHtml = state.classrooms.map((room, idx) => `
                <div class="grid grid-cols-[2fr_1fr_auto] gap-4 items-center bg-slate-50 p-3 rounded-lg border border-slate-100">
                    <input type="text" value="${room.name}" onchange="handleRoomChange(${idx}, 'name', this.value)" class="bg-white border border-slate-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none w-full"/>
                    <div class="relative">
                        <input type="number" value="${room.capacity}" onchange="handleRoomChange(${idx}, 'capacity', this.value)" class="bg-white border border-slate-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none w-full pl-10"/>
                        <i class="fa-solid fa-users absolute left-3 top-2.5 text-slate-400"></i>
                    </div>
                    <button onclick="deleteRoom('${room.id}')" class="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-md transition-colors" title="Terem törlése">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            `).join('');

            return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-6 border-b border-slate-200 flex justify-between items-center">
                        <div>
                            <h2 class="text-lg font-bold text-slate-800">Tantermek kezelése</h2>
                            <p class="text-sm text-slate-500">Módosítsd a termek kapacitását. Összevont órához min. 300 fő, külön órához min. 150 fő szükséges.</p>
                        </div>
                        <button onclick="addRoom()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors">
                            <i class="fa-solid fa-plus mr-1"></i> Új terem
                        </button>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-[2fr_1fr_auto] gap-4 mb-2 font-semibold text-slate-500 text-sm px-2">
                            <div>Terem neve</div>
                            <div>Kapacitás (Fő)</div>
                            <div>Művelet</div>
                        </div>
                        <div class="space-y-3">
                            ${roomsHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- INICIALIZÁLÁS ---
        initDates();
        loadData(); // Betölti a localStorage-ból vagy legenerálja az elsőt
        render(); // Kirajzolás
    </script>
</body>
</html>
